version: "3.9"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    env_file:
      - "./2 - Database/db.env" # Load environment variables from db.env file into the container
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3>/dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
  db_init:
    image: python:3.11-slim-bookworm
    container_name: db_init
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - "./2 - Database/db.env" # Load environment variables from db.env file into the container
    environment:
      ODBC_DRIVER: "ODBC Driver 17 for SQL Server"
      DB_SERVER: db # Using explicit service name for the database server to not be mistaken for localhost
    volumes:
      - ./2 - Database:/2 - Database
      - ./1 - Web Scrapping:/1 - Web Scrapping:ro
      - ./requirements.txt:/tmp/requirements.txt:ro
    working_dir: /2 - Database
    command: >
      bash -lc "
      set -euo pipefail &&
      echo 'Acquire::Retries \"5\";' > /etc/apt/apt.conf.d/80-retries &&
      apt-get update &&
      apt-get install -y --no-install-recommends build-essential unixodbc-dev curl gnupg2 ca-certificates &&
      mkdir -p /etc/apt/keyrings &&
      curl -fsSL https://packages.microsoft.com/keys/microsoft.asc -o /etc/apt/keyrings/microsoft.asc &&
      echo 'deb [signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/debian/12/prod bookworm main' > /etc/apt/sources.list.d/mssql-release.list &&
      apt-get update &&
      ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql17 &&
      rm -rf /var/lib/apt/lists/* &&
      (pip install --no-cache-dir -r /tmp/requirements.txt || pip install --no-cache-dir pandas sqlalchemy pyodbc python-dotenv flask werkzeug) &&
      python '2 - building database.py'
      "
  app:
    image: python:3.11-slim-bookworm
    container_name: app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - "./2 - Database/db.env" # Load environment variables from db.env file into the container
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: RAE2
      ODBC_DRIVER: "ODBC Driver 17 for SQL Server"
    working_dir: /3 - Dashboard
    volumes:
      - ./3 - Dashboard:/3 - Dashboard
    ports:
      - "935:935"
    #   - "8050:8050"
    command: >
      bash -lc "
      set -euo pipefail &&
      echo 'Acquire::Retries \"5\";' > /etc/apt/apt.conf.d/80-retries &&
      echo 'deb https://deb.debian.org/debian bookworm main' > /etc/apt/sources.list &&
      echo 'deb https://security.debian.org/debian-security bookworm-security main' >> /etc/apt/sources.list &&
      echo 'deb https://deb.debian.org/debian bookworm-updates main' >> /etc/apt/sources.list &&
      apt-get update &&
      apt-get install -y --no-install-recommends build-essential unixodbc-dev curl gnupg2 ca-certificates &&
      mkdir -p /etc/apt/keyrings &&
      curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor --batch --yes -o /etc/apt/keyrings/microsoft.gpg &&
      echo 'deb [signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main' > /etc/apt/sources.list.d/mssql-release.list &&
      apt-get update &&
      apt-get -o Acquire::Retries=5 update &&
      apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential unixodbc-dev curl gnupg2 ca-certificates &&
      ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql17 &&
      rm -rf /var/lib/apt/lists/* &&
      python -m pip install --no-cache-dir -U pip &&
      python -m pip install --no-cache-dir -r requirements.txt &&
      ./wait-for-db.sh db 1433 60 &&
      python app.py
      "

volumes:
  mssqldata: